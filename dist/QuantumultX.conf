# Quantumult X 自维护配置
# 不含代理节点。导入后请在客户端添加自己的节点订阅。
# 完整配置更新需重新下载；远程规则按 update-interval 刷新。

[general]
server_check_url=http://www.gstatic.com/generate_204
server_check_timeout=3000

[dns]
server=223.5.5.5
server=119.29.29.29

[policy]
static=节点选择, proxy, direct
static=苹果服务, direct, 节点选择
static=AI服务, 节点选择, direct
static=兜底分流, 节点选择, direct

[server_remote]
# 在客户端添加私人节点订阅，不要提交到公开仓库。

[server_local]

[filter_remote]
https://raw.githubusercontent.com/Ethereal-09/quantumultx-rules/main/dist/rules/custom-direct.list, tag=custom-direct, update-interval=86400, enabled=true
https://raw.githubusercontent.com/Ethereal-09/quantumultx-rules/main/dist/rules/custom-proxy.list, tag=custom-proxy, update-interval=86400, enabled=true
https://raw.githubusercontent.com/Ethereal-09/quantumultx-rules/main/dist/rules/custom-reject.list, tag=custom-reject, update-interval=86400, enabled=true
https://raw.githubusercontent.com/Ethereal-09/quantumultx-rules/main/dist/rules/direct-upstream.list, tag=direct-upstream, update-interval=86400, enabled=true, force-policy=direct
https://raw.githubusercontent.com/Ethereal-09/quantumultx-rules/main/dist/rules/advertising.list, tag=advertising, update-interval=86400, enabled=true, force-policy=reject
https://raw.githubusercontent.com/Ethereal-09/quantumultx-rules/main/dist/rules/apple.list, tag=apple, update-interval=86400, enabled=true, force-policy=苹果服务
https://raw.githubusercontent.com/Ethereal-09/quantumultx-rules/main/dist/rules/openai.list, tag=openai, update-interval=86400, enabled=true, force-policy=AI服务
https://raw.githubusercontent.com/Ethereal-09/quantumultx-rules/main/dist/rules/github.list, tag=github, update-interval=86400, enabled=true, force-policy=节点选择
https://raw.githubusercontent.com/Ethereal-09/quantumultx-rules/main/dist/rules/telegram.list, tag=telegram, update-interval=86400, enabled=true, force-policy=节点选择
https://raw.githubusercontent.com/Ethereal-09/quantumultx-rules/main/dist/rules/proxy.list, tag=proxy, update-interval=86400, enabled=true, force-policy=节点选择

[filter_local]
ip-cidr, 127.0.0.0/8, direct
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 192.168.0.0/16, direct
ip6-cidr, ::1/128, direct
ip6-cidr, fc00::/7, direct
geoip, cn, direct
final, 兜底分流

[rewrite_remote]


[rewrite_local]


[task_local]

[mitm]
# 如启用 HTTPS 重写，请在客户端生成并安装自己的证书。
# hostname 未配置
